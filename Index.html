<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Yaumi — Mutaba'ah Yaumiyah</title>
  <meta name="description" content="Mutaba'ah Yaumiyah — ruang kecil untuk menjaga istiqamah setiap hari.">
  <meta name="theme-color" content="#103d30">

  <!-- Browser favicon -->
  <link rel="icon" type="image/png" href="https://s-url.site/images/logo.png?v=3">

  <!-- iPhone / iPad Home Screen -->
  <link rel="apple-touch-icon" sizes="180x180" href="https://s-url.site/images/logo.png?v=3">
  <meta name="apple-mobile-web-app-title" content="Yaumi">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
    :root {
      --forest-950:#0c2f25;
      --forest-900:#103d30;
      --forest-800:#185642;
      --gold:#caa44c;
      --paper:#f6f8f7;
      --text:#1c2b26;
    }

    * { box-sizing:border-box; }
    html, body {
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:var(--paper);
    }

    body {
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }

    #app-frame {
      width:100%;
      height:100%;
      border:0;
      display:block;
      background:#fff;
    }

    /* Loading screen */
    #loader {
      position:fixed;
      inset:0;
      z-index:20;
      display:flex;
      align-items:center;
      justify-content:center;
      background:
        radial-gradient(circle at 80% 10%, rgba(202,164,76,.18), transparent 22%),
        linear-gradient(145deg, var(--forest-950), var(--forest-800));
      transition:opacity .35s ease, visibility .35s ease;
    }

    #loader.hidden {
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    .loader-card {
      width:min(360px, calc(100% - 32px));
      text-align:center;
      color:#fff;
    }

    .logo-wrap {
      width:78px;
      height:78px;
      margin:0 auto 18px;
      border-radius:22px;
      overflow:hidden;
      background:#fff;
      box-shadow:0 18px 45px rgba(0,0,0,.18);
      display:grid;
      place-items:center;
    }

    .logo-wrap img {
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .loader-title {
      font-size:1.35rem;
      font-weight:700;
      margin-bottom:6px;
      letter-spacing:-.02em;
    }

    .loader-subtitle {
      color:rgba(255,255,255,.72);
      font-size:.86rem;
    }

    .spinner {
      width:26px;
      height:26px;
      margin:18px auto 0;
      border:3px solid rgba(255,255,255,.18);
      border-top-color:var(--gold);
      border-radius:50%;
      animation:spin .8s linear infinite;
    }

    @keyframes spin { to { transform:rotate(360deg); } }

    /* Safe-area support for iPhone */
    @supports(padding:max(0px)) {
      #app-frame {
        height:100dvh;
      }
    }
  </style>
</head>
<body>
  <div id="loader" aria-hidden="true">
    <div class="loader-card">
      <div class="logo-wrap">
        <img src="https://s-url.site/images/logo.png?v=3" alt="Yaumi">
      </div>
      <div class="loader-title">Mutaba'ah Yaumiyah</div>
      <div class="loader-subtitle">Menyiapkan ruang kecil untuk menjaga istiqamah…</div>
      <div class="spinner"></div>
    </div>
  </div>

  <iframe
    id="app-frame"
    title="Mutaba'ah Yaumiyah"
    src="https://script.google.com/macros/s/AKfycbzPqzfySC-PaOv-ikMam9mtpWEHoTh1jG91gV8LPC6lSlxMTa_GMIirnyGdoilFaP-g/exec"
    allow="fullscreen"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>

  <script>
    const frame = document.getElementById('app-frame');
    const loader = document.getElementById('loader');

    function hideLoader() {
      loader.classList.add('hidden');
    }

    frame.addEventListener('load', hideLoader);

    // Fallback agar loading screen tidak tertahan bila browser menunda event load.
    setTimeout(hideLoader, 8000);
  </script>
</body>
</html>
